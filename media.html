<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A multimedia gallery with audio, video, maps, and images">
    <title>Multimedia Gallery</title>
</head>
<body>

    <!-- TODO 1: PAGE HEADER & NAVIGATION -->
    <header>
        <h1>Multimedia Gallery</h1>
        <nav aria-label="Gallery navigation">
            <ul>
                <li><a href="#audio">Audio</a></li>
                <li><a href="#video">Video</a></li>
                <li><a href="#map">Map</a></li>
                <li><a href="#gallery">Gallery</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- TODO 2: AUDIO SECTION -->
        <section id="audio">
            <h2>Audio Player</h2>
            <figure>
                <audio controls>
                    <source src="audio/sample.mp3" type="audio/mpeg">
                    Your browser does not support the audio element.
                </audio>
                <figcaption>Sample audio track "Calm Ambient Sound"</figcaption>
            </figure>
        </section>

        <!-- TODO 3: VIDEO SECTION -->
        <section id="video">
            <h2>Video Player</h2>
            <figure>
                <video controls width="640" poster="https://via.placeholder.com/640x360">
                    <source src="video/sample.mp4" type="video/mp4">
                    Your browser does not support the video element.
                </video>
                <figcaption>Sample video "Nature and Technology Showcase"</figcaption>
            </figure>
        </section>

        <!-- TODO 4: MAP SECTION -->
        <section id="map">
            <h2>Our Location</h2>
            <figure>
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3401.5!2d34.43!3d31.50!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzHCsDMwJzAwLjAiTiAzNMKwMjUnNDguMCJF!5e0!3m2!1sen!2sps!4v1700000000000"
                    width="600"
                    height="400"
                    style="border:0;"
                    allowfullscreen=""
                    loading="lazy"
                    title="Map showing Al-Aqsa University in Gaza"></iframe>
                <figcaption>Al-Aqsa University, Gaza, Palestine</figcaption>
            </figure>
        </section>

        <!-- TODO 5: IMAGE GALLERY SECTION -->
        <section id="gallery">
            <h2>Image Gallery</h2>

            <figure>
                <img src="https://via.placeholder.com/400x300" alt="Modern laptop and workspace desk" width="400">
                <figcaption>Image 1: Study and coding workspace</figcaption>
            </figure>

            <figure>
                <img src="https://via.placeholder.com/400x300" alt="Green hills and clear sky landscape" width="400">
                <figcaption>Image 2: Peaceful outdoor landscape</figcaption>
            </figure>

            <figure>
                <img src="https://via.placeholder.com/400x300" alt="Open notebook and pen on table" width="400">
                <figcaption>Image 3: Notes and daily planning</figcaption>
            </figure>

            <figure>
                <img src="https://via.placeholder.com/400x300" alt="Bookshelf organized with reference books" width="400">
                <figcaption>Image 4: Reference books collection</figcaption>
            </figure>
        </section>
    </main>

    <!-- TODO 6: FOOTER -->
    <footer>
        <p>&copy; 2026 Multimedia Gallery. All rights reserved.</p>
        <address>
            Created by <a href="mailto:baraa.bakhit@example.com">Baraa Bakhit</a>
        </address>
    </footer>

</body>
</html>
